# Local PostgreSQL for development.
#
#   docker compose up -d
#   pnpm db:push
#
# The credentials here match the DATABASE_URL in `.env.example`.
services:
  postgres:
    image: postgres:18-alpine
    container_name: financas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financas
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d financas']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
